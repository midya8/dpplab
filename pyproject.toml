[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "dpplab"
version = "0.1.0"
description = "Exact finite L-ensemble subset and conditioning audits"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Midya Rahmani"}]
[project.scripts]
dpplab = "dpplab.cli:main"
[tool.setuptools.packages.find]
include = ["dpplab*"]
